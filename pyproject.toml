[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-tesco"
version = "0.1.0"
description = "Phase 1 Tesco conversation extraction, reconstruction, and taxonomy discovery sampling pipeline."
readme = "README.md"
authors = [{ name = "Hiver SDE Candidate" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
